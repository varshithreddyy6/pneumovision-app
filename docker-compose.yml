# Optional. Local two-terminal run (see README) is enough for v0.
services:
  api:
    build: ./services/api
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
